<!DOCTYPE html>
<html>
    <head>
        <meta charset="'utf-8">
        <meta name="viewport" content="'width=device-width'initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>yvzern's tic-tac-toe</title>
        <script src="'app.js" defer></script>
    </head>
    <body>
        <main class='game'>
            <p class='eyebrow'></p>welcome to yvzern' project</p>
            <h1>tic-tac-toe</h1>
            <p class="instruction">
                each turn a player puts in x or o. score 3 in a row and you will be the winner
            </p>
<p id="status" role="'status">player x's turn</p>
<div class='board' role='group' aria-lable='tic-tac-toe board'>

    <button class='cell' type='button' aria- label='square 1: empty'></button>
    <button class='cell' type='button' aria- label='square 2: empty'></button>
    <button class='cell' type='button' aria- label='square 3: empty'></button>
    <button class='cell' type='button' aria- label='square 4: empty'></button>
    <button class='cell' type='button' aria- label='square 5: empty'></button>
    <button class='cell' type='button' aria- label='square 6: empty'></button>
    <button class='cell' type='button' aria- label='square 7: empty'></button>
    <button class='cell' type='button' aria- label='square 8: empty'></button>
    <button class='cell' type='button' aria- label='square 9: empty'></button>
</div>
<button id="'restart" type='button'>
    press here to restart
</button>
<p class="footnote">
    two players, same device. x goes first
</p>
        </main>
    </body>
</html>
